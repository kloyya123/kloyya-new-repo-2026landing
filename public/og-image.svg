<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Kloyya — Ask for the outcome, not the answer">
  <defs>
    <radialGradient id="mesh" cx="82%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#DCE7FB" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#EDF2FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FBFAF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="12%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#EDF6F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FBFAF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#FBFAF8"/>
  <rect width="1200" height="630" fill="url(#mesh)"/>
  <rect width="1200" height="630" fill="url(#mesh2)"/>

  <!-- wordmark -->
  <g transform="translate(96, 92)">
    <rect x="0" y="0" width="30" height="30" rx="7" fill="#2159C5"/>
    <rect x="8" y="8" width="14" height="14" rx="3" fill="#FBFAF8"/>
    <text x="46" y="24" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="600" letter-spacing="-1" fill="#14161A">Kloyya</text>
  </g>

  <!-- headline -->
  <text x="94" y="330" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="82" font-weight="600" letter-spacing="-3.5" fill="#14161A">
    <tspan x="96">Ask for the outcome,</tspan>
    <tspan x="96" dy="96">not the <tspan font-family="Newsreader, Georgia, serif" font-style="italic" font-weight="400" fill="#17408E">answer</tspan>.</tspan>
  </text>

  <!-- sub -->
  <text x="96" y="512" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#57534C">
    <tspan x="96">The intelligence layer on top of the tools your work already lives in.</tspan>
  </text>

  <line x1="96" y1="560" x2="1104" y2="560" stroke="#E7E3DB" stroke-width="1"/>
  <text x="96" y="592" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="15" letter-spacing="1.5" fill="#8C877E">KLOYYA.COM</text>
</svg>
